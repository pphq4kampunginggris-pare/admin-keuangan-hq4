<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SantriPay Admin - Sistem Keuangan Pesantren (Real-Time)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white;
      }
      .no-print {
        display: none !important;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_PESANTREN = {
      nama: "Pondok Pesantren Al-Hidayah",
      alamat: "Jl. Pendidikan Islam No. 45, Kebayoran, Jakarta",
      telepon: "0812-3456-7890",
      pimpinan: "KH. Ahmad Dahlan, M.Ag",
      bendahara: "Ust. Muhammad Ridwan"
    };

    const DEFAULT_CONFIG = {
      sppBulanan: 350000,
      uangMakan: 400000,
      uangKitab: 150000,
      uangGedung: 500000
    };

    const DEFAULT_USERS = [
      { id: 'u1', username: 'admin', password: 'admin123', role: 'admin', name: 'Bendahara Utama' },
      { id: 'u2', username: 'ustazah', password: 'ustazah123', role: 'ustazah', name: 'Ustazah Fatimah (Pengajar)' }
    ];

    // URL Google Apps Script yang ditanamkan langsung secara default
    const HARDCODED_GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwXfwvJztnGU6tc7tfL0fFXlOPlXaDCPuq_1Av0Zp3qq5Zv0eD1EcYRBWcxYQ6-tBC6PQ/exec";

    function App() {
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('santri_app_users');
        return saved ? JSON.parse(saved) : DEFAULT_USERS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('santri_admin_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [pesantren, setPesantren] = useState(() => {
        const saved = localStorage.getItem('santri_pesantren_info');
        return saved ? JSON.parse(saved) : DEFAULT_PESANTREN;
      });

      const [configTagihan, setConfigTagihan] = useState(() => {
        const saved = localStorage.getItem('santri_config_tagihan');
        return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
      });

      const [santriList, setSantriList] = useState(() => {
        const saved = localStorage.getItem('santri_list_data');
        return saved ? JSON.parse(saved) : [];
      });

      const [transaksiList, setTransaksiList] = useState(() => {
        const saved = localStorage.getItem('santri_transaksi_data');
        return saved ? JSON.parse(saved) : [];
      });

      const [googleSheetUrl, setGoogleSheetUrl] = useState(() => {
        return localStorage.getItem('santri_google_sheet_url') || HARDCODED_GOOGLE_SHEET_URL;
      });

      const [lastSyncTime, setLastSyncTime] = useState(() => {
        return localStorage.getItem('santri_last_sync_time') || null;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [printedReceipt, setPrintedReceipt] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [selectedSantriForPayment, setSelectedSantriForPayment] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
      };

      useEffect(() => { localStorage.setItem('santri_app_users', JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem('santri_admin_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('santri_pesantren_info', JSON.stringify(pesantren)); }, [pesantren]);
      useEffect(() => { localStorage.setItem('santri_config_tagihan', JSON.stringify(configTagihan)); }, [configTagihan]);
      useEffect(() => { localStorage.setItem('santri_list_data', JSON.stringify(santriList)); }, [santriList]);
      useEffect(() => { localStorage.setItem('santri_transaksi_data', JSON.stringify(transaksiList)); }, [transaksiList]);
      useEffect(() => { localStorage.setItem('santri_google_sheet_url', googleSheetUrl); }, [googleSheetUrl]);

      useEffect(() => {
        const handleStorageChange = (e) => {
          if (e.key === 'santri_list_data' && e.newValue) setSantriList(JSON.parse(e.newValue));
          if (e.key === 'santri_transaksi_data' && e.newValue) setTransaksiList(JSON.parse(e.newValue));
          if (e.key === 'santri_google_sheet_url' && e.newValue) setGoogleSheetUrl(e.newValue);
        };
        window.addEventListener('storage', handleStorageChange);

        let bc;
        if ('BroadcastChannel' in window) {
          bc = new BroadcastChannel('santripay_live_channel');
          bc.onmessage = (event) => {
            if (event.data?.type === 'SYNC_DATA') {
              const savedSantri = localStorage.getItem('santri_list_data');
              if (savedSantri) setSantriList(JSON.parse(savedSantri));
              const savedTx = localStorage.getItem('santri_transaksi_data');
              if (savedTx) setTransaksiList(JSON.parse(savedTx));
            }
          };
        }

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          if (bc) bc.close();
        };
      }, []);

      const notifyLocalTabs = () => {
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel('santripay_live_channel');
          bc.postMessage({ type: 'SYNC_DATA' });
          bc.close();
        }
      };

      const fetchCloudData = async (quiet = false) => {
        if (!googleSheetUrl || !googleSheetUrl.trim()) return;
        if (!quiet) setIsSyncing(true);
        try {
          const response = await fetch(googleSheetUrl);
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          const resData = await response.json();
          if (resData && resData.status === 'success') {
            if (Array.isArray(resData.santriList)) setSantriList(resData.santriList);
            if (Array.isArray(resData.transaksiList)) setTransaksiList(resData.transaksiList);
            const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            setLastSyncTime(timeNow);
            localStorage.setItem('santri_last_sync_time', timeNow);
            notifyLocalTabs();
            if (!quiet) showToast('Data berhasil disinkronkan dari Cloud!', 'success');
          }
        } catch (err) {
          console.warn("Cloud Fetch Notice:", err.message || err);
        } finally {
          if (!quiet) setIsSyncing(false);
        }
      };

      useEffect(() => {
        if (!currentUser) return;
        fetchCloudData(true);
        const autoSyncInterval = setInterval(() => {
          fetchCloudData(true);
        }, 4000); // Polling otomatis setiap 4 detik tanpa refresh

        return () => clearInterval(autoSyncInterval);
      }, [googleSheetUrl, currentUser]);

      const syncToGoogleSheets = async (actionType, payloadData) => {
        if (!googleSheetUrl || !googleSheetUrl.trim()) return;
        setIsSyncing(true);
        try {
          await fetch(googleSheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: actionType, data: payloadData })
          });
          const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          setLastSyncTime(timeNow);
          localStorage.setItem('santri_last_sync_time', timeNow);
          notifyLocalTabs();
          showToast('Tersimpan & tersinkron ke Cloud!', 'success');
          setTimeout(() => fetchCloudData(true), 1000);
        } catch (err) {
          showToast('Data tersimpan secara lokal', 'info');
        } finally {
          setIsSyncing(false);
        }
      };

      const handleLogin = (usernameInput, passwordInput) => {
        const adminAccount = users.find(u => u.role === 'admin');
        if (adminAccount && usernameInput.trim() === adminAccount.username && passwordInput === adminAccount.password) {
          setCurrentUser(adminAccount);
          showToast(`Selamat datang, ${adminAccount.name}!`, 'success');
          return true;
        } else {
          showToast('Username atau password Admin salah!', 'error');
          return false;
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('santri_admin_user');
        showToast('Anda telah keluar dari aplikasi Admin', 'info');
      };

      const totalPemasukan = transaksiList
        .filter(t => t.jenis === 'masuk')
        .reduce((sum, t) => sum + Number(t.jumlah), 0);

      const totalPengeluaran = transaksiList
        .filter(t => t.jenis === 'keluar')
        .reduce((sum, t) => sum + Number(t.jumlah), 0);

      const saldoKas = totalPemasukan - totalPengeluaran;

      const triggerPrintReceipt = (receiptData) => {
        setPrintedReceipt(receiptData);
        setTimeout(() => {
          window.print();
        }, 300);
      };

      const handleQuickPayFromTunggakan = (santri) => {
        setSelectedSantriForPayment(santri);
        setActiveTab('pembayaran');
      };

      const handleSelectTab = (tabId) => {
        setActiveTab(tabId);
        setIsMobileMenuOpen(false);
      };

      if (!currentUser) {
        return <AdminLoginView onLogin={handleLogin} pesantren={pesantren} />;
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
          
          {toast.show && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg border flex items-center space-x-3 transition-all transform duration-300 ${
              toast.type === 'success' ? 'bg-emerald-900 text-white border-emerald-700' : 'bg-rose-900 text-white border-rose-700'
            }`}>
              <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'} text-lg`}></i>
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {isMobileMenuOpen && (
            <div 
              onClick={() => setIsMobileMenuOpen(false)}
              className="fixed inset-0 bg-slate-950/70 z-40 md:hidden backdrop-blur-sm transition-opacity"
            ></div>
          )}

          {/* Sidebar Admin Navigation */}
          <aside className={`fixed md:static top-0 left-0 h-full z-50 w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800 transition-transform duration-300 ${
            isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
          }`}>
            <div>
              <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-emerald-900/50">
                    <i className="fa-solid fa-user-shield"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-white text-base leading-tight">SantriPay</h1>
                    <p className="text-[11px] text-emerald-400 flex items-center gap-1 font-semibold">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                      Real-Time Admin
                    </p>
                  </div>
                </div>
                <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-slate-400 hover:text-white p-2">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>
              </div>

              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                  { id: 'pembayaran', label: 'Pembayaran SPP', icon: 'fa-file-invoice-dollar' },
                  { id: 'tunggakan', label: 'Tunggakan Santri', icon: 'fa-triangle-exclamation' },
                  { id: 'santri', label: 'Data Santri', icon: 'fa-users' },
                  { id: 'kas', label: 'Buku Kas Umum', icon: 'fa-wallet' },
                  { id: 'laporan', label: 'Laporan Keuangan', icon: 'fa-file-lines' },
                  { id: 'pengaturan', label: 'Pengaturan & Cloud', icon: 'fa-gear' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => handleSelectTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition ${
                      activeTab === item.id 
                        ? 'bg-emerald-600 text-white shadow-md shadow-emerald-900/30 font-semibold' 
                        : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-5 text-center text-base`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 space-y-2">
              <div className="bg-slate-800/90 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between">
                <div className="truncate pr-2">
                  <p className="text-xs font-bold text-white truncate">{currentUser.name}</p>
                  <p className="text-[10px] text-emerald-400 uppercase font-bold">Akses Bendahara</p>
                </div>
                <button onClick={handleLogout} className="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white p-2 rounded-lg transition text-xs" title="Keluar">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>

              <button
                onClick={() => fetchCloudData()}
                disabled={isSyncing}
                className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 p-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2"
              >
                <i className={`fa-solid fa-arrows-rotate ${isSyncing ? 'animate-spin' : ''}`}></i>
                <span>{isSyncing ? 'Menarik Data...' : 'Sync Data Cloud'}</span>
              </button>
            </div>
          </aside>

          {/* Header Bar */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            {}
            <header className="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3 sticky top-0 z-10 shadow-sm">
              <div className="flex items-center space-x-3 min-w-0">
                <button
                  onClick={() => setIsMobileMenuOpen(true)}
                  className="md:hidden p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 transition text-lg flex items-center justify-center"
                >
                  <i className="fa-solid fa-bars"></i>
                </button>

                <div className="truncate">
                  <h2 className="text-base sm:text-lg font-bold text-slate-900 truncate">
                    {activeTab === 'dashboard' && 'Dashboard Overview Keuangan'}
                    {activeTab === 'pembayaran' && 'Pencatatan SPP & Tagihan'}
                    {activeTab === 'tunggakan' && 'Laporan Tunggakan Santri'}
                    {activeTab === 'santri' && 'Manajemen Data Santri'}
                    {activeTab === 'kas' && 'Kas Pemasukan & Pengeluaran'}
                    {activeTab === 'laporan' && 'Laporan & Rekapitulasi'}
                    {activeTab === 'pengaturan' && 'Pengaturan & Cloud Sync'}
                  </h2>
                  <p className="text-[11px] text-slate-500 truncate">{pesantren.nama}</p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-shrink-0">
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  <span className="hidden sm:inline">Live Auto-Sync (4s)</span>
                </div>

                <div className="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5">
                  <i className="fa-solid fa-vault text-emerald-400"></i>
                  <span>Rp {saldoKas.toLocaleString('id-ID')}</span>
                </div>
              </div>
            </header>

            <div className="p-4 sm:p-6">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  totalPemasukan={totalPemasukan}
                  totalPengeluaran={totalPengeluaran}
                  saldoKas={saldoKas}
                  santriList={santriList}
                  transaksiList={transaksiList}
                  setActiveTab={setActiveTab}
                />
              )}

              {activeTab === 'pembayaran' && (
                <PembayaranView 
                  santriList={santriList}
                  configTagihan={configTagihan}
                  transaksiList={transaksiList}
                  setTransaksiList={setTransaksiList}
                  triggerPrintReceipt={triggerPrintReceipt}
                  syncToGoogleSheets={syncToGoogleSheets}
                  showToast={showToast}
                  selectedSantriForPayment={selectedSantriForPayment}
                  setSelectedSantriForPayment={setSelectedSantriForPayment}
                  currentUser={currentUser}
                />
              )}

              {activeTab === 'tunggakan' && (
                <TunggakanView 
                  santriList={santriList}
                  transaksiList={transaksiList}
                  configTagihan={configTagihan}
                  pesantren={pesantren}
                  handleQuickPayFromTunggakan={handleQuickPayFromTunggakan}
                />
              )}

              {activeTab === 'santri' && (
                <SantriView 
                  santriList={santriList}
                  setSantriList={setSantriList}
                  syncToGoogleSheets={syncToGoogleSheets}
                  showToast={showToast}
                />
              )}

              {activeTab === 'kas' && (
                <KasView 
                  transaksiList={transaksiList}
                  setTransaksiList={setTransaksiList}
                  triggerPrintReceipt={triggerPrintReceipt}
                  syncToGoogleSheets={syncToGoogleSheets}
                  showToast={showToast}
                  currentUser={currentUser}
                />
              )}

              {activeTab === 'laporan' && (
                <LaporanView 
                  transaksiList={transaksiList}
                  pesantren={pesantren}
                />
              )}

              {activeTab === 'pengaturan' && (
                <PengaturanView 
                  pesantren={pesantren}
                  setPesantren={setPesantren}
                  configTagihan={configTagihan}
                  setConfigTagihan={setConfigTagihan}
                  googleSheetUrl={googleSheetUrl}
                  setGoogleSheetUrl={setGoogleSheetUrl}
                  fetchCloudData={fetchCloudData}
                  isSyncing={isSyncing}
                  showToast={showToast}
                  users={users}
                  setUsers={setUsers}
                />
              )}
            </div>
          </main>

          {/* Printable Receipt */}
          {printedReceipt && (
            <div id="printable-area" className="hidden print:block font-mono text-slate-900 bg-white p-6 border rounded-xl max-w-md mx-auto">
              <div className="text-center border-b pb-3 mb-3">
                <h2 className="font-bold text-base uppercase">{pesantren.nama}</h2>
                <p className="text-[10px]">{pesantren.alamat}</p>
                <p className="text-[10px]">Telp: {pesantren.telepon}</p>
              </div>

              <div className="text-center my-3">
                <span className="font-bold border-b border-black text-xs uppercase tracking-widest">BUKTI PEMBAYARAN RESMI</span>
                <p className="text-[10px] text-slate-600 mt-1">No: {printedReceipt.noKwitansi}</p>
              </div>

              <table className="w-full text-xs space-y-1 mb-4">
                <tbody>
                  <tr><td className="py-1 text-slate-500">Tanggal</td><td className="py-1 font-semibold">: {printedReceipt.tanggal}</td></tr>
                  {printedReceipt.namaSantri !== '-' && (
                    <>
                      <tr><td className="py-1 text-slate-500">Santri</td><td className="py-1 font-semibold">: {printedReceipt.namaSantri} ({printedReceipt.nis})</td></tr>
                      <tr><td className="py-1 text-slate-500">Periode</td><td className="py-1 font-semibold">: {printedReceipt.bulan}</td></tr>
                    </>
                  )}
                  <tr><td className="py-1 text-slate-500">Jenis Transaksi</td><td className="py-1 font-semibold">: {printedReceipt.kategori}</td></tr>
                  <tr><td className="py-1 text-slate-500">Petugas</td><td className="py-1 font-semibold">: {printedReceipt.petugas || 'Bendahara Keuangan'}</td></tr>
                  <tr><td className="py-1 text-slate-500">Keterangan</td><td className="py-1 font-semibold">: {printedReceipt.keterangan || '-'}</td></tr>
                </tbody>
              </table>

              <div className="border-t border-b border-dashed border-black py-2 my-2 text-center">
                <span className="text-xs">JUMLAH DIBAYAR:</span>
                <div className="text-lg font-bold">Rp {Number(printedReceipt.jumlah).toLocaleString('id-ID')}</div>
              </div>

              <div className="flex justify-between text-[10px] mt-6 text-center">
                <div>
                  <p>Santri/Wali</p>
                  <div className="h-10"></div>
                  <p>( ........................... )</p>
                </div>
                <div>
                  <p>Bendahara Keuangan</p>
                  <div className="h-10"></div>
                  <p>( {printedReceipt.petugas || pesantren.bendahara} )</p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function AdminLoginView({ onLogin, pesantren }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onLogin(username, password);
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-100">
            <div className="text-center mb-6">
              <div className="w-16 h-16 bg-emerald-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-emerald-900/30">
                <i className="fa-solid fa-user-shield"></i>
              </div>
              <h2 className="text-xl font-extrabold text-slate-900">Login Admin &amp; Keuangan</h2>
              <p className="text-xs text-slate-500 mt-1">{pesantren.nama}</p>
            </div>

              <p className="font-bold text-slate-800 mb-1"><i className="fa-solid fa-key text-emerald-600 mr-1"></i> Akun Login Default Admin:</p>
              <div className="bg-white p-2.5 rounded border mt-2 text-[11px]">
                <p>Username: <code className="bg-slate-100 px-1.5 py-0.5 rounded font-bold text-slate-800">admin</code></p>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Username Admin</label>
                <input
                  type="text"
                  required
                  value={username}

              <div>
                <label className="block font-bold text-slate-700 mb-1">Kata Sandi (Password)</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={e => setPassword(e.target.value)}

                  placeholder="Masukkan password admin..."
                />
              </div>

              <button
                type="submit"
                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-900/20 flex items-center justify-center space-x-2"

                <i className="fa-solid fa-right-to-bracket"></i>

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartRef.current) {
          if (chartInstance.current) chartInstance.current.destroy();
          const ctx = chartRef.current.getContext('2d');
          
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Total Pemasukan', 'Total Pengeluaran'],
              datasets: [{
                data: [totalPemasukan, totalPengeluaran],
                backgroundColor: ['#10b981', '#f43f5e'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } }
            }

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();

              <div className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div className="flex items-center justify-between mb-2">

                  <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xs sm:text-sm">

                <div className="flex items-center justify-between mb-2">
                  <span className="text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase">Pemasukan</span>
                  <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center text-xs sm:text-sm">
                    <i className="fa-solid fa-arrow-down-left"></i>
                  </div>
                </div>
                <h3 className="text-xs sm:text-base font-extrabold text-emerald-600 truncate">Rp {totalPemasukan.toLocaleString('id-ID')}</h3>

              <div className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase">Pengeluaran</span>
                  <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xs sm:text-sm">
                    <i className="fa-solid fa-arrow-up-right"></i>
                  </div>

            <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">

              <div>

                        <td className="p-2.5 font-medium">{tx.kategori}</td>
